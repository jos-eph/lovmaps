name: Release tiles

# Dated GitHub Releases CI/CD pipeline for the Philadelphia commute-region
# .pmtiles / .osm.pbf assets. See CLAUDE_REFERENCE/CI_CD_RELEASE_PLAN.md (§4.2)
# for the full specification, and §3 (decisions D1, D3, D4, D5, D6, D7, D9).
# Source PBFs: Pennsylvania + New Jersey + Delaware + Maryland state extracts,
# merged (SOURCE_PA_URL / SOURCE_NJ_URL / SOURCE_DE_URL / SOURCE_MD_URL below)
# — see SPECS/01_FIXES for why this replaced the original single us-northeast
# extract (it omits Delaware).
#
# Behaviour summary:
#   * Scheduled daily run at 04:30 UTC (D5).
#   * Manual run via workflow_dispatch; set push_release=false to build without
#     uploading anything (smoke test).
#   * Publishing is also gated by repo variable RELEASE_PIPELINE_ENABLED. It
#     must equal the literal string 'true' for any upload to occur. This is the
#     kill switch from plan §11 — @jos-eph can flip it in the GitHub UI
#     (Settings -> Secrets and variables -> Actions -> Variables) without
#     editing the workflow file.
#   * Two-release pattern (D4): immutable `tiles-<DATE>` for pinning, rolling
#     `current` for "always latest" consumers.
#   * Dated releases beyond the most recent 30 are pruned (D6).

on:
  schedule:
    - cron: '30 4 * * *'   # D5: 04:30 UTC, after Geofabrik daily refresh.
  workflow_dispatch:
    inputs:
      push_release:
        description: 'Build and publish a release now (false = build-only smoke test)'
        type: boolean
        default: true

permissions:
  contents: write   # required to create releases and upload assets

concurrency:
  group: release-tiles
  cancel-in-progress: false   # never let a manual run clobber a scheduled run mid-flight

env:
  # Canonical upstream sources — Pennsylvania + New Jersey + Delaware +
  # Maryland state extracts (CI_CD_RELEASE_PLAN.md §1.1, updated per
  # SPECS/01_FIXES). These are osmium-merged by generate_tiles_pb.py into one
  # region PBF. Delaware is its own Geofabrik state extract (the old
  # us-northeast source did not include it, leaving DE streets blank below the
  # bbox's PA/DE border). Maryland is the same story one border further west:
  # BBOX's southwest corner covers Cecil County, so without it everything
  # south of the Mason-Dixon line and west of the DE state line rendered as
  # empty canvas.
  SOURCE_PA_URL: https://download.geofabrik.de/north-america/us/pennsylvania-latest.osm.pbf
  SOURCE_PA_MD5_URL: https://download.geofabrik.de/north-america/us/pennsylvania-latest.osm.pbf.md5
  SOURCE_NJ_URL: https://download.geofabrik.de/north-america/us/new-jersey-latest.osm.pbf
  SOURCE_NJ_MD5_URL: https://download.geofabrik.de/north-america/us/new-jersey-latest.osm.pbf.md5
  SOURCE_DE_URL: https://download.geofabrik.de/north-america/us/delaware-latest.osm.pbf
  SOURCE_DE_MD5_URL: https://download.geofabrik.de/north-america/us/delaware-latest.osm.pbf.md5
  SOURCE_MD_URL: https://download.geofabrik.de/north-america/us/maryland-latest.osm.pbf
  SOURCE_MD_MD5_URL: https://download.geofabrik.de/north-america/us/maryland-latest.osm.pbf.md5
  # Pinned tippecanoe source release used when the runner has no cached binary.
  TIPPECANOE_VERSION: '2.79.0'
  BASE_NAME: philly_commute_region
  # Must stay identical to generate_tiles_pb.py's DEFAULT_BBOX -- this is the
  # value that actually governs releases. North edge bounds the SEPTA service
  # area (tip at Riegelsville, 40.60). Every source above is clipped to this
  # one box, so adding a state widens coverage without widening the region.
  BBOX: '-76.00,39.30,-74.30,40.65'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Run unit tests
        # Stdlib-only suite (no osmium/tippecanoe/network needed), so it runs
        # before the expensive toolchain setup and fails the job fast. See
        # fixmaps SPECS/06_COUNTY_BORDER_PATTERNS impl spec, Chunk L0.
        run: python -m unittest discover -s tests -v

      - name: Install osmium-tool
        # osmium-tool is in the Ubuntu apt repo; tippecanoe is not (it's a Felt
        # project distributed only as source). We install osmium directly and
        # cache a self-built tippecanoe in the next steps (D7).
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
          osmium --version

      - name: Cache tippecanoe binary
        id: cache-tippecanoe
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: /usr/local/bin/tippecanoe
          key: tippecanoe-${{ runner.os }}-${{ env.TIPPECANOE_VERSION }}

      - name: Build tippecanoe from source (cache miss)
        if: steps.cache-tippecanoe.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            build-essential libsqlite3-dev zlib1g-dev
          curl -fsSL --retry 3 --retry-delay 10 \
            "https://github.com/felt/tippecanoe/archive/refs/tags/${TIPPECANOE_VERSION}.tar.gz" \
            -o /tmp/tippecanoe.tar.gz
          mkdir -p /tmp/tippecanoe-src
          tar -xzf /tmp/tippecanoe.tar.gz -C /tmp/tippecanoe-src --strip-components=1
          make -C /tmp/tippecanoe-src -j"$(nproc)"
          sudo install -m 0755 /tmp/tippecanoe-src/tippecanoe /usr/local/bin/tippecanoe

      - name: Verify tippecanoe
        run: tippecanoe --version

      - name: Compute run date stamp
        id: date
        # Matches generate_tiles_pb.py's default_date_stamp() and plan D3
        # ("naturally sortable ISO"). Filename-safe (no colons).
        run: |
          set -euo pipefail
          DATE="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          echo "DATE=${DATE}" >> "$GITHUB_ENV"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "Run date stamp: ${DATE}"

      - name: Decide whether to publish
        id: gate
        # Two independent conditions must hold for publishing:
        #   1. The trigger is not a workflow_dispatch with push_release=false.
        #   2. Repo variable RELEASE_PIPELINE_ENABLED == 'true' (plan §11 kill
        #      switch). If unset, publishing is skipped — the human must opt in
        #      via Settings -> Variables before the daily schedule starts
        #      releasing artifacts.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUSH_RELEASE: ${{ inputs.push_release }}
          KILL_SWITCH: ${{ vars.RELEASE_PIPELINE_ENABLED }}
        run: |
          set -euo pipefail
          PUBLISH=true
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_PUSH_RELEASE}" != "true" ]; then
            PUBLISH=false
            echo "::notice::Skipping publish: workflow_dispatch with push_release=false (build-only)"
          fi
          if [ "${KILL_SWITCH}" != "true" ]; then
            PUBLISH=false
            echo "::notice::Skipping publish: repo variable RELEASE_PIPELINE_ENABLED is not 'true' (current value: '${KILL_SWITCH}'). Set it to 'true' in Settings -> Variables to enable releases."
          fi
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "Publish decision: ${PUBLISH}"

      - name: Refuse to clobber an existing dated release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "tiles-${DATE}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release tiles-${DATE} already exists. Refusing to overwrite dated assets (plan §5)."
            exit 1
          fi

      - name: Download source PBFs (PA, NJ, DE, MD) with retry and md5 verification
        # Three attempts with exponential backoff (30s, 2m, 8m) per source.
        # Each PBF lands in ${RUNNER_TEMP} — ephemeral runner storage, never
        # the workspace, never the git tree (plan §4.2 step 5). Four state
        # extracts replace the old single us-northeast download (see env
        # block above for why).
        run: |
          set -euo pipefail
          download_one() {
            local name="$1" url="$2" md5_url="$3" dest="$4"
            local attempts=3 delay=30
            for i in $(seq 1 "${attempts}"); do
              echo "Source PBF download attempt ${i}/${attempts} (${name})"
              rm -f "${dest}" "${dest}.part" "${dest}.md5"
              if curl -fsSL -o "${dest}.part" "${url}" \
                 && curl -fsSL -o "${dest}.md5" "${md5_url}"; then
                mv "${dest}.part" "${dest}"
                expected="$(awk '{print tolower($1)}' "${dest}.md5")"
                actual="$(md5sum "${dest}" | awk '{print tolower($1)}')"
                if [ -n "${expected}" ] && [ "${expected}" = "${actual}" ]; then
                  echo "MD5 verified (${name}): ${actual}"
                  echo "SOURCE_${name}_MD5=${actual}" >> "$GITHUB_ENV"
                  return 0
                fi
                echo "::warning::MD5 mismatch on attempt ${i} for ${name} (expected '${expected}', got '${actual}')"
              else
                echo "::warning::Download failed on attempt ${i} for ${name}"
              fi
              if [ "${i}" -lt "${attempts}" ]; then
                echo "Sleeping ${delay}s before retry"
                sleep "${delay}"
                delay=$((delay * 4))
              fi
            done
            echo "::error::All ${attempts} download attempts failed for ${name}; aborting."
            return 1
          }

          download_one PA "${SOURCE_PA_URL}" "${SOURCE_PA_MD5_URL}" "${RUNNER_TEMP}/pennsylvania-latest.osm.pbf"
          download_one NJ "${SOURCE_NJ_URL}" "${SOURCE_NJ_MD5_URL}" "${RUNNER_TEMP}/new-jersey-latest.osm.pbf"
          download_one DE "${SOURCE_DE_URL}" "${SOURCE_DE_MD5_URL}" "${RUNNER_TEMP}/delaware-latest.osm.pbf"
          download_one MD "${SOURCE_MD_URL}" "${SOURCE_MD_MD5_URL}" "${RUNNER_TEMP}/maryland-latest.osm.pbf"

      - name: Generate pmtiles and region PBF
        # Passing --source-pbf (repeated) suppresses the script's built-in
        # download path so the workflow remains the sole owner of network
        # I/O. generate_tiles_pb.py bbox-clips each of PA/NJ/DE/MD and
        # osmium-merges the clips into the single region PBF.
        run: |
          set -euo pipefail
          mkdir -p ./out
          python generate_tiles_pb.py \
            --base-name "${BASE_NAME}" \
            --date "${DATE}" \
            --output-dir ./out \
            --bbox="${BBOX}" \
            --source-pbf "${RUNNER_TEMP}/pennsylvania-latest.osm.pbf" \
            --source-pbf "${RUNNER_TEMP}/new-jersey-latest.osm.pbf" \
            --source-pbf "${RUNNER_TEMP}/delaware-latest.osm.pbf" \
            --source-pbf "${RUNNER_TEMP}/maryland-latest.osm.pbf"

      - name: Sanity-check outputs
        run: |
          set -euo pipefail
          PMTILES="./out/${BASE_NAME}_${DATE}.pmtiles"
          PBF="./out/${BASE_NAME}_${DATE}.osm.pbf"
          REGION_LABELS="./out/${BASE_NAME}_${DATE}.region_labels.json"
          for f in "${PMTILES}" "${PBF}" "${REGION_LABELS}"; do
            if [ ! -f "${f}" ]; then
              echo "::error::Expected output missing: ${f}"
              exit 1
            fi
          done
          SIZE="$(stat -c '%s' "${PMTILES}")"
          echo "pmtiles size: ${SIZE} bytes"
          if [ "${SIZE}" -lt 102400 ]; then
            echo "::error::pmtiles is suspiciously small (< 100 KB); refusing to publish."
            exit 1
          fi
          # region_labels.json (07 resolution spec Chunk L9): its own manifest
          # check (enforce_region_labels_manifest) already failed the build if
          # a required state/county area is missing, so this is just a basic
          # sanity floor plus the ~150 KB simplification budget from the spec.
          python3 -c "import json,sys; d=json.load(open('${REGION_LABELS}')); sys.exit(0 if d.get('features') else 1)" \
            || { echo "::error::region_labels.json has no features"; exit 1; }
          RL_SIZE="$(stat -c '%s' "${REGION_LABELS}")"
          echo "region_labels.json size: ${RL_SIZE} bytes"
          if [ "${RL_SIZE}" -gt 200000 ]; then
            echo "::warning::region_labels.json is ${RL_SIZE} bytes, over the ~150 KB simplification budget (07 resolution spec §2/L9) -- not failing the build, but worth a look."
          fi

      - name: Generate sha256 sidecars (dated)
        # `sha256sum` output format — consumers verify with `sha256sum -c`.
        run: |
          set -euo pipefail
          cd ./out
          for ext in pmtiles osm.pbf region_labels.json; do
            f="${BASE_NAME}_${DATE}.${ext}"
            sha256sum "${f}" > "${f}.sha256"
            echo "sha256(${f}) = $(awk '{print $1}' "${f}.sha256")"
          done

      - name: Build traceability blob
        run: |
          set -euo pipefail
          RUN_TXT="./out/${BASE_NAME}_${DATE}.run.txt"
          PMTILES_SHA="$(awk '{print $1}' "./out/${BASE_NAME}_${DATE}.pmtiles.sha256")"
          PBF_SHA="$(awk '{print $1}' "./out/${BASE_NAME}_${DATE}.osm.pbf.sha256")"
          REGION_LABELS_SHA="$(awk '{print $1}' "./out/${BASE_NAME}_${DATE}.region_labels.json.sha256")"
          {
            echo "date: ${DATE}"
            echo "generated_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "git_sha: ${GITHUB_SHA}"
            echo "git_ref: ${GITHUB_REF}"
            echo "workflow_run_url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "source_pa_url: ${SOURCE_PA_URL}"
            echo "source_pa_md5: ${SOURCE_PA_MD5:-unknown}"
            echo "source_nj_url: ${SOURCE_NJ_URL}"
            echo "source_nj_md5: ${SOURCE_NJ_MD5:-unknown}"
            echo "source_de_url: ${SOURCE_DE_URL}"
            echo "source_de_md5: ${SOURCE_DE_MD5:-unknown}"
            echo "source_md_url: ${SOURCE_MD_URL}"
            echo "source_md_md5: ${SOURCE_MD_MD5:-unknown}"
            echo "bbox: ${BBOX}"
            echo "pmtiles_sha256: ${PMTILES_SHA}"
            echo "osm_pbf_sha256: ${PBF_SHA}"
            echo "region_labels_json_sha256: ${REGION_LABELS_SHA}"
            echo "tippecanoe_version: ${TIPPECANOE_VERSION}"
          } > "${RUN_TXT}"
          cat "${RUN_TXT}"

      - name: Stage 'current' assets (rename + re-sha256)
        if: steps.gate.outputs.publish == 'true'
        # The .sha256 sidecars must reference the renamed (`_current`) basenames
        # so consumers can run `sha256sum -c` against the downloaded files.
        run: |
          set -euo pipefail
          mkdir -p ./out/current
          for ext in pmtiles osm.pbf region_labels.json; do
            cp "./out/${BASE_NAME}_${DATE}.${ext}" "./out/current/${BASE_NAME}_current.${ext}"
          done
          cd ./out/current
          for ext in pmtiles osm.pbf region_labels.json; do
            f="${BASE_NAME}_current.${ext}"
            sha256sum "${f}" > "${f}.sha256"
          done

      - name: Create dated release and upload assets
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          {
            echo "Automated tile build."
            echo
            echo "- DATE: ${DATE}"
            echo "- source PA: ${SOURCE_PA_URL} (md5 ${SOURCE_PA_MD5:-unknown})"
            echo "- source NJ: ${SOURCE_NJ_URL} (md5 ${SOURCE_NJ_MD5:-unknown})"
            echo "- source DE: ${SOURCE_DE_URL} (md5 ${SOURCE_DE_MD5:-unknown})"
            echo "- source MD: ${SOURCE_MD_URL} (md5 ${SOURCE_MD_MD5:-unknown})"
            echo "- bbox: ${BBOX}"
            echo "- git SHA: ${GITHUB_SHA}"
            echo "- tippecanoe: ${TIPPECANOE_VERSION}"
            echo "- workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "See ATTRIBUTION.txt and MAP-DATA-LICENSE.md (if uploaded) for license / attribution."
          } > "${NOTES_FILE}"

          ASSETS=(
            "./out/${BASE_NAME}_${DATE}.pmtiles"
            "./out/${BASE_NAME}_${DATE}.pmtiles.sha256"
            "./out/${BASE_NAME}_${DATE}.osm.pbf"
            "./out/${BASE_NAME}_${DATE}.osm.pbf.sha256"
            "./out/${BASE_NAME}_${DATE}.region_labels.json"
            "./out/${BASE_NAME}_${DATE}.region_labels.json.sha256"
            "./out/${BASE_NAME}_${DATE}.run.txt"
          )
          if [ -f ATTRIBUTION.txt ]; then
            ASSETS+=(ATTRIBUTION.txt)
          fi
          if [ -f MAP-DATA-LICENSE.md ]; then
            ASSETS+=(MAP-DATA-LICENSE.md)
          fi

          gh release create "tiles-${DATE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Tiles ${DATE}" \
            --notes-file "${NOTES_FILE}" \
            "${ASSETS[@]}"

      - name: Update 'current' rolling release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view current --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create current \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Current tiles (rolling)" \
              --notes "Rolling release: assets are overwritten by every successful daily build. Pin to a dated tiles-<DATE> release for immutability. See ATTRIBUTION.txt for license."
          fi
          ASSETS=(
            "./out/current/${BASE_NAME}_current.pmtiles"
            "./out/current/${BASE_NAME}_current.pmtiles.sha256"
            "./out/current/${BASE_NAME}_current.osm.pbf"
            "./out/current/${BASE_NAME}_current.osm.pbf.sha256"
            "./out/current/${BASE_NAME}_current.region_labels.json"
            "./out/current/${BASE_NAME}_current.region_labels.json.sha256"
          )
          if [ -f ATTRIBUTION.txt ]; then
            ASSETS+=(ATTRIBUTION.txt)
          fi
          if [ -f MAP-DATA-LICENSE.md ]; then
            ASSETS+=(MAP-DATA-LICENSE.md)
          fi
          gh release upload current --clobber \
            --repo "${GITHUB_REPOSITORY}" \
            "${ASSETS[@]}"

      - name: Prune dated releases beyond the most recent 30
        # D6: keep the most recent 30 dated releases; never prune `current`.
        # Sort by tagName (newest first), drop the first 30, delete the rest
        # along with their tags. tagName (tiles-YYYY-MM-DDTHH-MM-SSZ) sorts
        # lexicographically == chronologically. Do NOT sort by createdAt:
        # GitHub sets a release's created_at from its target commit, and every
        # dated release tags the same unchanged main commit, so createdAt is
        # identical across releases and the tie-broken sort prunes whichever
        # release `gh release list` happens to put last -- often the one just
        # created.
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 1000 \
            --json tagName \
            --jq 'map(select(.tagName | startswith("tiles-"))) | sort_by(.tagName) | reverse | .[30:] | .[].tagName' \
            > /tmp/prune.txt
          if [ ! -s /tmp/prune.txt ]; then
            echo "Nothing to prune (have <= 30 dated releases)."
            exit 0
          fi
          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            echo "Pruning old release: ${tag}"
            gh release delete "${tag}" --yes --cleanup-tag --repo "${GITHUB_REPOSITORY}"
          done < /tmp/prune.txt
